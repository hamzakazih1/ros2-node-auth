name: tests

# Runs the dependency-free part of the project: the authentication logic and
# the standalone attack simulation. No ROS 2 install and no pip packages —
# nothing is installed on purpose, so a test that starts needing one fails here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover tests -v

      - name: Simulation smoke run
        run: |
          python sim/simulate.py --scenario unsecured
          python sim/simulate.py --scenario secured
          python sim/simulate.py --scenario replay
